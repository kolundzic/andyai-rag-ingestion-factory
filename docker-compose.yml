services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: andyai-rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  postgres:
    image: postgres:16
    container_name: andyai-rag-postgres
    environment:
      POSTGRES_DB: andyai_rag
      POSTGRES_USER: andyai
      POSTGRES_PASSWORD: andyai_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_storage:/var/lib/postgresql/data

volumes:
  qdrant_storage:
  postgres_storage:
