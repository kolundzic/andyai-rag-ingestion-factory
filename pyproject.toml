[project]
name = "andyai-rag-ingestion-factory"
version = "10.5.0"
description = "Canonical AndyAI RAG ingestion factory for large PDF libraries"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115.0", "uvicorn>=0.30.0"]
qdrant = ["qdrant-client>=1.9.0"]
pdf = ["pymupdf>=1.24.0"]
postgres = ["psycopg[binary]>=3.2.0"]

[project.scripts]
andyai-rag = "rag_ingestion_factory.cli.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
